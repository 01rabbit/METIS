name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      METIS_TEST_DOCKER_IMAGE: python@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - run: docker pull "$METIS_TEST_DOCKER_IMAGE"
      - run: python -m pytest
      - run: ruff check src tests
      - run: mypy src/metis
      - run: metis validate challenges/training/fixture-001.json
      - run: python -m build --outdir '${{ runner.temp }}/metis-dist'
