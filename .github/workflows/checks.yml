name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --locked --extra dev
      - run: .venv/bin/python -m pytest
      - run: .venv/bin/ruff check src tests
      - run: .venv/bin/mypy src/metis
      - run: .venv/bin/python scripts/check_repo.py
      - run: .venv/bin/python scripts/check_blue_knowledge.py
      - run: .venv/bin/metis validate challenges/training/fixture-001.json
      - run: .venv/bin/python -m build --outdir '${{ runner.temp }}/metis-dist'
  macos-wheel-smoke:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.5
          enable-cache: false
      - name: Build wheel and prepare locked dependency wheelhouse
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          python -c 'import platform; assert platform.machine() == "arm64"'
          uv sync --locked --extra dev --python "$(command -v python)"
          uv build --wheel --clear --no-create-gitignore --python "$(command -v python)" \
            --out-dir "$RUNNER_TEMP/metis-dist"
          uv export --quiet --locked --no-dev --no-emit-project --format requirements-txt \
            --output-file "$RUNNER_TEMP/runtime-requirements.txt"
          python -m pip download --only-binary=:all: --require-hashes \
            --requirement "$RUNNER_TEMP/runtime-requirements.txt" \
            --dest "$RUNNER_TEMP/runtime-wheelhouse"
      - name: Install into a clean virtual environment and smoke test
        run: |
          project_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          python -m venv metis-install-venv
          metis_python="$RUNNER_TEMP/metis-install-venv/bin/python"
          metis_cli="$RUNNER_TEMP/metis-install-venv/bin/metis"
          "$metis_python" -m pip install --no-index --find-links runtime-wheelhouse \
            --require-hashes --requirement runtime-requirements.txt
          "$metis_python" -m pip install --no-index --no-deps metis-dist/*.whl
          "$metis_python" -m pip check
          "$metis_python" -c 'from pathlib import Path; import metis, sys; assert Path(metis.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())'
          actual_version=$("$metis_cli" --version)
          printf '%s\n' "$actual_version"
          test "$actual_version" = "METIS $project_version"
          "$metis_cli" doctor
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --locked --extra dev
      - run: docker build --tag metis-sandbox:zipcrypto --platform linux/amd64 sandbox
      - name: Record immutable test image
        run: echo "METIS_TEST_SANDBOX_IMAGE=$(docker image inspect --format='{{.Id}}' metis-sandbox:zipcrypto)" >> "$GITHUB_ENV"
      - name: Test sandbox budgets, workflow replay and ZipCrypto intent chain
        env:
          METIS_TEST_SLOW: '1'
        run: >-
          .venv/bin/python -m pytest -v
          tests/test_ctf_sandbox.py::test_real_engine_enforces_memory_limit
          tests/test_ctf_sandbox.py::test_real_engine_timeout_removes_process_group
          tests/test_ctf_sandbox.py::test_real_engine_separate_controller_recovers_orphaned_sandbox
          tests/test_ctf_workflow.py
          tests/test_workflow_model_trial.py::test_external_fixture_real_docker_replay_keeps_oracle_private
          tests/test_ctf_zipcrypto.py::test_zipcrypto_worker_enforces_container_deadline
          tests/test_ctf_zipcrypto.py::test_zipcrypto_real_low_memory_container_reports_memory_limit
          tests/test_ctf_zipcrypto.py::test_zipcrypto_production_profile_oom_classification_and_cleanup
          tests/test_ctf_zipcrypto.py::test_specialist_intents_full_search_decrypt_and_xor
