name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      METIS_TEST_DOCKER_IMAGE: python@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
      METIS_REQUIRE_DOCKER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --locked --extra dev
      - run: docker pull "$METIS_TEST_DOCKER_IMAGE"
      - run: .venv/bin/python -m pytest
      - run: .venv/bin/ruff check src tests
      - run: .venv/bin/mypy src/metis
      - run: .venv/bin/metis validate challenges/training/fixture-001.json
      - run: .venv/bin/python -m build --outdir '${{ runner.temp }}/metis-dist'
