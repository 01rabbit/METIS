name: METIS validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-arm64-seccomp:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Validate seccomp process and thread behavior on aarch64
        run: python -m pytest -q tests/test_codex_isolation.py::test_seccomp_blocks_processes_but_allows_threads
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and validation tools
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Linux isolation backend (bubblewrap) for Codex specialists
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
          python -c "from metis.core.codex_isolation import isolation_backend as b; print('isolation backend:', b())"
      - name: Codex isolation tests (Linux results are reported, a missing backend is a skip)
        run: python -m pytest -ra tests/test_codex_isolation.py
      - name: Issue 11 acceptance tests
        run: python -m pytest -ra tests/test_agent_orchestration.py tests/test_ctf_orchestration.py
      - name: Full test suite
        run: python -m pytest -ra
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: Mypy
        run: python -m mypy src/metis
      - name: Build distributions
        run: python -m build
