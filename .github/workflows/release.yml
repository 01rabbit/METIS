name: signed release artifacts
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install locked build tooling
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.5
          enable-cache: false
      - name: Require a main-branch commit and matching version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag)
          if not match or ".".join(match.groups()) != project["version"]:
              raise SystemExit("release tag must be a vMAJOR.MINOR.PATCH match for pyproject.toml")
          PY
      - name: Install locked project tools and build distributions
        run: |
          uv sync --locked --extra dev
          uv build --clear --no-create-gitignore --out-dir dist
      - name: Validate release artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          project_name=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["name"])')
          project_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          .venv/bin/python -m metis.release_artifacts \
            --dist-dir dist --tag "$RELEASE_TAG" \
            --project-name "$project_name" --project-version "$project_version" \
            --write-checksums
      - name: Install the built wheel with locked dependencies and smoke test
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt \
            --output-file "$RUNNER_TEMP/runtime-requirements.txt"
          python -m pip download --require-hashes \
            --requirement "$RUNNER_TEMP/runtime-requirements.txt" \
            --dest "$RUNNER_TEMP/runtime-wheelhouse"
          python -m venv "$RUNNER_TEMP/metis-release-venv"
          "$RUNNER_TEMP/metis-release-venv/bin/python" -m pip install \
            --no-index --find-links "$RUNNER_TEMP/runtime-wheelhouse" --require-hashes \
            --requirement "$RUNNER_TEMP/runtime-requirements.txt"
          "$RUNNER_TEMP/metis-release-venv/bin/python" -m pip install \
            --no-index --find-links "$RUNNER_TEMP/runtime-wheelhouse" --no-deps dist/*.whl
          "$RUNNER_TEMP/metis-release-venv/bin/metis" --version
          "$RUNNER_TEMP/metis-release-venv/bin/metis" doctor
      - name: Verify exact staged release bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          project_name=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["name"])')
          project_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          .venv/bin/python -m metis.release_artifacts \
            --dist-dir dist --tag "$RELEASE_TAG" \
            --project-name "$project_name" --project-version "$project_version" \
            --verify-checksums
      - name: Attest package archives and checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/*'
      - name: Verify package attestations before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          for artifact in dist/*.whl dist/*.tar.gz dist/SHA256SUMS; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
          gh release create "$TAG_NAME" dist/* --verify-tag --generate-notes
