name: release attestation drill
on:
  workflow_dispatch:
permissions:
  contents: read
  attestations: write
  id-token: write
concurrency:
  group: release-attestation-drill-${{ github.ref }}
  cancel-in-progress: false
jobs:
  drill:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install locked build tooling
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.5
          enable-cache: false
      - name: Build and validate unsigned release candidate
        run: |
          uv sync --locked --extra dev
          uv build --clear --no-create-gitignore --out-dir dist
          project_name=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["name"])')
          project_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          .venv/bin/python -m metis.release_artifacts \
            --dist-dir dist --tag "v$project_version" \
            --project-name "$project_name" --project-version "$project_version"
          sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
      - name: Install wheel with locked dependencies and smoke test
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt \
            --output-file "$RUNNER_TEMP/runtime-requirements.txt"
          python -m pip download --require-hashes \
            --requirement "$RUNNER_TEMP/runtime-requirements.txt" \
            --dest "$RUNNER_TEMP/runtime-wheelhouse"
          python -m venv "$RUNNER_TEMP/metis-release-venv"
          "$RUNNER_TEMP/metis-release-venv/bin/python" -m pip install \
            --no-index --find-links "$RUNNER_TEMP/runtime-wheelhouse" --require-hashes \
            --requirement "$RUNNER_TEMP/runtime-requirements.txt"
          "$RUNNER_TEMP/metis-release-venv/bin/python" -m pip install \
            --no-index --find-links "$RUNNER_TEMP/runtime-wheelhouse" --no-deps dist/*.whl
          "$RUNNER_TEMP/metis-release-venv/bin/metis" --version
          "$RUNNER_TEMP/metis-release-venv/bin/metis" doctor
      - name: Attest candidate archives and checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/*'
      - name: Verify attestations without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in dist/*.whl dist/*.tar.gz dist/SHA256SUMS; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done
